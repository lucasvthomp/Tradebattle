<!DOCTYPE html>
<html>
<head>
  <title>Manual Payment Credit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #06121F;
      color: #C9D1E2;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #E3B341;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #1E2D3F;
      border: 1px solid #2B3A4C;
      color: #C9D1E2;
      border-radius: 4px;
    }
    button {
      background: #E3B341;
      color: #06121F;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    button:hover {
      background: #c99a35;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background: rgba(40, 199, 111, 0.2);
      border: 1px solid #28C76F;
      color: #28C76F;
    }
    .error {
      background: rgba(255, 79, 88, 0.2);
      border: 1px solid #FF4F58;
      color: #FF4F58;
    }
  </style>
</head>
<body>
  <h1>Manual Payment Credit</h1>
  <p>Admin tool to manually credit a crypto payment</p>

  <form id="creditForm">
    <div class="form-group">
      <label>Payment ID</label>
      <input type="text" id="paymentId" value="5653033856" required>
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" value="muri" required>
    </div>

    <div class="form-group">
      <label>Amount (USD)</label>
      <input type="number" id="amount" value="20" step="0.01" required>
    </div>

    <button type="submit">Credit Payment</button>
  </form>

  <div id="result" class="result"></div>

  <script>
    document.getElementById('creditForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const paymentId = document.getElementById('paymentId').value;
      const username = document.getElementById('username').value;
      const amount = parseFloat(document.getElementById('amount').value);

      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'none';

      try {
        const response = await fetch('/api/crypto/manual-credit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ paymentId, username, amount }),
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✅ Success!</h3>
            <p>${data.message}</p>
            <p><strong>Payment Status:</strong> ${data.paymentStatus}</p>
            <p><strong>Old Balance:</strong> $${data.oldBalance.toFixed(2)}</p>
            <p><strong>New Balance:</strong> $${data.newBalance.toFixed(2)}</p>
          `;
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>❌ Error</h3>
            <p>${data.error}</p>
          `;
        }

        resultDiv.style.display = 'block';
      } catch (error) {
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ Error</h3>
          <p>${error.message}</p>
        `;
        resultDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
